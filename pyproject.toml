[project]
name = "english-tutor"
version = "0.1.0"
description = "Self-hosted Telegram English practice bot that tracks your speaking/writing errors"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "sidnevart" }]

dependencies = [
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # bot UX
    "aiogram>=3.26,<3.29",
    # scheduling
    "apscheduler>=3.10,<4",
    # LLM access (OpenAI-compatible Ollama endpoint)
    "openai>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local speech-to-text (free, uses ffmpeg). Not wired up yet — STT_BACKEND=cloud
# (Groq/OpenAI) or stub is used. Install to enable a local whisper backend later.
stt = ["faster-whisper>=1.0"]
# Local text-to-speech. Not wired up yet — TTS_BACKEND=groq or stub is used.
tts = ["edge-tts>=6.1"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
tutor = "tutor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/tutor"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tutor.bot.handlers"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "tutor.bot.main"
disable_error_code = ["arg-type"]
